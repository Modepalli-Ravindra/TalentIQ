[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -x
markers =
    unit: Unit tests
    integration: Integration tests
    etl: ETL pipeline tests
    ai: AI service tests
    slow: Slow running tests
filterwarnings =
    ignore::DeprecationWarning
